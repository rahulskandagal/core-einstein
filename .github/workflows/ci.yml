name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: PHP syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mysqli
      - name: php -l on every file
        run: |
          set -e
          find . -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 php -l

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: docker compose up -d --build --wait
      - name: Home page responds
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8090/ || true)
            [ "$code" = "200" ] && echo "OK ($code)" && exit 0
            sleep 3
          done
          echo "site did not come up"; docker compose logs; exit 1
      - name: Admin login works
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -d 'username=rahulsk&password=1234' http://localhost:8090/admin/login.php)
          [ "$code" = "302" ] && echo "OK" || { echo "expected 302, got $code"; exit 1; }
      - name: SQL dump is not served
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8090/database/tourism_db.sql)
          [ "$code" = "403" ] && echo "OK" || { echo "expected 403, got $code"; exit 1; }
      - if: always()
        run: docker compose down -v
